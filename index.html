<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starters Practice Tests</title>
<style>
:root{--ink:#2b2b2b;--brand:#5b3a8c;--brand2:#7d5bb5;--soft:#f3eefb;--ok:#27ae60;--bad:#e74c3c;--line:#d9d2e6}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:var(--ink);background:#ebe7f2}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1100px;margin:0 auto;padding:10px 16px}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px;margin-right:auto}
.logo small{display:block;font-weight:400;font-size:11px;opacity:.8;letter-spacing:0}
.tabs{display:flex;gap:6px}
.ttab,.stab{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:20px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
.ttab.on,.stab.on{background:#fff;color:var(--brand)}
.score{font-size:13px;background:rgba(0,0,0,.18);padding:6px 12px;border-radius:14px;white-space:nowrap}
.score b{font-size:15px}
.reset{background:none;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:14px;padding:6px 10px;cursor:pointer;font-size:12px}
#paper{max-width:1100px;margin:18px auto 60px;padding:0 12px}
.cover{background:#fff;border-radius:10px;padding:18px 24px;margin-bottom:16px;border-left:8px solid var(--brand)}
.cover h2{margin:0 0 6px;color:var(--brand)}
.cover p{margin:0;line-height:1.5}
.part{background:#fff;border-radius:10px;padding:20px 24px 16px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.part-head{display:flex;align-items:baseline;gap:12px;border-bottom:3px solid var(--brand);padding-bottom:6px;margin-bottom:8px}
.pnum{font-size:24px;font-weight:800;color:var(--brand)}
.pq{font-size:14px;color:#666}
.instr{font-weight:700;font-size:17px;margin:6px 0 14px}
.pfoot{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand2)}
.btn.ghostbtn{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.btn.big{font-size:17px;padding:13px 26px}
.res{font-size:20px;font-weight:800;color:var(--bad)}
.res.good{color:var(--ok)}
.endbar{text-align:center;margin:24px 0}
.sub{font-weight:700;color:var(--brand);margin:12px 0 6px;font-size:15px}
.qn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--brand);font-weight:800;font-size:14px;margin-right:8px;flex:none}
.qn:empty{display:none}
svg{display:block}
svg .o{stroke:#2b2b2b;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.scenebox{border:3px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff}
.scenebox svg{width:100%;height:auto}
/* audio bar */
.aud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.audlab{font-size:13px;color:#555;margin-left:10px}
.seg{border:2px solid var(--brand);background:#fff;color:var(--brand);border-radius:50%;width:36px;height:36px;font-weight:800;cursor:pointer}
.seg.playing,.play.playing{background:#f39c12;border-color:#f39c12;color:#fff}
/* L1 */
.l1{position:relative;user-select:none}
.names{display:flex;justify-content:space-around;gap:10px;padding:10px 0;flex-wrap:wrap}
.chip{border:3px solid var(--ink);background:#fff;border-radius:8px;padding:8px 18px;font-weight:800;font-size:18px;cursor:grab;touch-action:none}
.chip.exchip{background:#eee;cursor:default}
.chip.sel{background:#fde9b5}
.chip.ok{background:#d4f5df;border-color:var(--ok)} .chip.bad{background:#fbd5d1;border-color:var(--bad)}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ln{stroke:#2b6cd4;stroke-width:4;stroke-linecap:round}
.ln.ex{stroke:#555}
.ln.temp{stroke:#f39c12;stroke-dasharray:8 6}
.ln.good{stroke:var(--ok)} .ln.wrong{stroke:var(--bad)}
.dot{fill:#2b2b2b}
.tgt{cursor:pointer}
/* L2 / lists */
.l2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.l2pic svg,.r5pic svg{width:100%;height:auto;border:3px solid var(--ink);border-radius:6px}
.qrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #f0edf5;flex-wrap:wrap}
.qt{flex:1 1 220px;font-size:16px}
.ans{font-size:16px;display:flex;align-items:center;gap:6px}
.filled{font-family:"Comic Sans MS","Segoe Print",cursive;color:#2b6cd4;font-size:18px;border-bottom:2px dotted #999;padding:0 10px;min-width:90px;display:inline-block;text-align:center}
input[type=text]{font-size:17px;padding:6px 10px;border:2px solid #bbb;border-radius:6px;width:150px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:var(--brand)}
input.ok{border-color:var(--ok);background:#e9f9ee} input.bad{border-color:var(--bad);background:#fdecea}
/* L3 */
.l3item{margin-bottom:18px}
.l3q{font-weight:700;font-size:16px;margin-bottom:8px;display:flex;align-items:center}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.opt-wrap{cursor:pointer;border-radius:8px;padding:4px}
.opt-wrap svg{width:100%;height:auto;border:3px solid var(--ink);border-radius:6px;background:#fff}
.lbl{display:flex;justify-content:center;align-items:center;gap:8px;font-weight:800;margin-top:6px}
.tick{width:28px;height:28px;border:3px solid var(--ink);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:#2b6cd4;background:#fff}
.opt-wrap.chosen .tick::after{content:"\2713"}
.opt-wrap.ok{background:#d4f5df} .opt-wrap.bad{background:#fbd5d1}
.opt-wrap.should .tick{border-color:var(--ok);box-shadow:0 0 0 3px #bfeccc}
/* L4 */
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding:8px;border-radius:10px;background:var(--soft)}
.palette.pulse{outline:3px solid #f39c12}
.crayon{display:flex;align-items:center;gap:6px;border:2px solid #ccc;background:#fff;border-radius:20px;padding:5px 12px 5px 6px;cursor:pointer;font-size:14px;font-weight:600}
.crayon span{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.crayon.sel{border-color:var(--ink);box-shadow:0 0 0 3px #f39c12}
.colable{cursor:pointer}
.colable:hover .f{filter:brightness(.93)}
.exg{cursor:default}
.colable.ok{filter:drop-shadow(0 0 4px #27ae60) drop-shadow(0 0 4px #27ae60)}
.colable.bad{filter:drop-shadow(0 0 4px #e74c3c) drop-shadow(0 0 4px #e74c3c)}
/* R1 */
.r1row{display:flex;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid #f0edf5}
.picbox{border:3px solid var(--ink);border-radius:6px;width:180px;flex:none;background:#fff}
.picbox svg{width:100%;height:auto}
.r1t{flex:1;font-size:18px}
.tickbox{width:42px;height:42px;border:3px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#2b6cd4}
.tc{display:flex;gap:8px;padding:4px;border-radius:8px}
.tc button{width:46px;height:46px;font-size:24px;border:3px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer;color:#bbb}
.tc button.on{color:#fff;background:#2b6cd4;border-color:#2b6cd4}
.tc.ok{background:#d4f5df} .tc.bad{background:#fbd5d1}
/* R2 */
.r2scene{margin-bottom:12px}
.yn{gap:8px;padding:4px;border-radius:8px}
.yn button{border:2px solid var(--ink);background:#fff;border-radius:6px;padding:6px 14px;font-size:16px;cursor:pointer;font-weight:600}
.yn button.on{background:#2b6cd4;color:#fff;border-color:#2b6cd4}
.yn.ok{background:#d4f5df} .yn.bad{background:#fbd5d1}
/* R3 */
.r3row{display:flex;align-items:center;gap:18px;padding:10px 0;border-bottom:1px solid #f0edf5}
.r3row .picbox{width:130px}
.slots{display:flex;gap:8px;padding:6px;border-radius:8px}
.slot{width:46px;height:50px;border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;font-family:"Comic Sans MS","Segoe Print",cursive;color:#2b6cd4;cursor:pointer}
.slots.ok{background:#d4f5df} .slots.bad{background:#fbd5d1}
.tiles{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tile{width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff8e1;cursor:grab;touch-action:none;user-select:none}
.tile.used{opacity:.25;pointer-events:none}
/* R4 */
.r4text{user-select:none;border:3px solid var(--ink);border-radius:6px;padding:14px 20px;font-size:18px;line-height:2.4}
.r4text h3{text-align:center;margin:0 0 4px;font-size:22px}
.r4hero svg{width:220px;margin:0 auto}
.gap{display:inline-block;min-width:120px;border-bottom:3px dotted var(--ink);text-align:center;line-height:1.5;padding:0 8px;cursor:pointer;font-family:"Comic Sans MS","Segoe Print",cursive;color:#2b6cd4;vertical-align:baseline}
.gap:empty::before{content:"\00a0"}
.gap.exgap{cursor:default}
.gap.filled{background:#fff8e1;border-bottom-style:solid}
.gap.ok{background:#d4f5df} .gap.bad{background:#fbd5d1}
.wordbox{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;border:3px solid var(--ink);border-radius:6px;padding:14px;margin-top:14px;user-select:none}
.wcard{width:110px;border:2px solid var(--ink);border-radius:8px;text-align:center;padding:6px;background:#fff;cursor:grab;touch-action:none;position:relative;font-weight:700}
.wcard .wpic{width:70px;height:70px;margin:0 auto}
.wcard.sel{box-shadow:0 0 0 4px #f39c12}
.wcard.used{opacity:.3}
.wcard.excard{opacity:.45;cursor:default}
.exlab{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10px;padding:1px 6px;border-radius:6px}
/* R5 */
.r5blk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:center;margin-bottom:16px}
/* drag ghost */
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) scale(1.08);opacity:.9;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.note{font-size:12px;color:#777;text-align:center;margin:30px 0}
@media (max-width:760px){.l2,.r5blk{grid-template-columns:1fr}.picbox{width:120px}.opts{gap:6px}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">Starters Practice Tests<small>Pre A1 level &middot; unofficial practice material</small></div>
    <div class="tabs" id="ttabs"></div>
    <div class="tabs"><button class="stab" data-s="L">Listening</button><button class="stab" data-s="R">Reading &amp; Writing</button></div>
    <div class="score">Listening <b id="totL">0 / 20</b> &nbsp;|&nbsp; R&amp;W <b id="totR">0 / 25</b></div>
    <button class="reset" id="resetAll">Reset test</button>
  </div>
</header>
<main id="paper"></main>
<p class="note">Original practice material in the style of the Pre A1 Starters exam. Audio uses the browser voice (best in Chrome or Edge).</p>
<script>
/* =========================================================
   ART LIBRARY - original cartoon illustrations drawn in SVG
   Origin of every object = bottom centre. Scenes = 800 x 500.
   Class "f"  = main fill (colourable)
   Class "fs" = main stroke (colourable, e.g. bike frame)
   ========================================================= */
const K = '#2b2b2b';
const SKIN = ['#f6cfa8', '#e8b48a', '#c98e62', '#8d5a3b'];
const tr = (t, x, y, s = 1, flip = false) => `<g transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})">${t}</g>`;
const R = (x, y, w, h, f, c = '', rx = 0) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" class="o ${c}"/>`;
const C = (x, y, r, f, c = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" class="o ${c}"/>`;
const E = (x, y, rx, ry, f, c = '') => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" class="o ${c}"/>`;
const P = (d, f = 'none', c = '') => `<path d="${d}" fill="${f}" class="o ${c}"/>`;
const Ln = (x1, y1, x2, y2, w = 2.5, col = K, c = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" class="${c}"/>`;
const limb = (pts, c, w = 9) => {
  const d = 'M' + pts.map(p => p.join(' ')).join(' L');
  return `<path d="${d}" fill="none" stroke="${K}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round"/>` +
         `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
};
const TXT = (x, y, t, size = 16, col = K, extra = '') => `<text x="${x}" y="${y}" font-size="${size}" fill="${col}" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" ${extra}>${t}</text>`;
const hit = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fff" fill-opacity="0.001"/>`;

/* ---------------- PEOPLE ---------------- */
function person(x, y, o = {}) {
  const kind = o.kind || 'boy';
  const adult = kind === 'man' || kind === 'woman';
  const s = (o.s || 1) * (adult ? 1.25 : 1);
  const skin = o.skin || SKIN[0], hair = o.hair || '#6b3e1e';
  const shirt = o.shirt || '#4a90d9', legsC = o.legs || '#3b5998';
  const pose = o.pose || 'stand', sit = pose === 'sit';
  const hip = sit ? 0 : -50, sh = hip - 42, hy = hip - 70;
  const legCol = o.dress ? skin : legsC;
  let back = '', body = '', head = '', item = '';

  // hair behind the head
  if (o.hairStyle === 'long') back += P(`M-21 ${hy - 6} Q-27 ${hy + 30} -17 ${hy + 34} L17 ${hy + 34} Q27 ${hy + 30} 21 ${hy - 6} Z`, hair);
  if (o.hairStyle === 'pony') back += E(-25, hy + 2, 7, 13, hair);

  // legs
  if (sit) {
    body += limb([[-6, hip], [24, hip], [26, hip + 40]], legCol, 10) + E(31, hip + 42, 9, 5, '#333');
  } else if (pose === 'run' || pose === 'kick') {
    const fx = pose === 'kick' ? 32 : 20, fy = pose === 'kick' ? -24 : -7;
    body += limb([[-5, hip], [-14, -26], [-22, -6]], legCol, 10) + limb([[5, hip], [fx, fy]], legCol, 10) +
            E(-24, -4, 9, 5, '#333') + E(fx + 3, fy + 2, 9, 5, '#333');
  } else if (pose === 'up' && o.jump) {
    body += limb([[-7, hip], [-12, -14]], legCol, 10) + limb([[7, hip], [12, -14]], legCol, 10) + E(-13, -10, 9, 5, '#333') + E(13, -10, 9, 5, '#333');
  } else {
    body += limb([[-8, hip], [-9, -7]], legCol, 10) + limb([[8, hip], [9, -7]], legCol, 10) + E(-10, -4, 9, 5, '#333') + E(10, -4, 9, 5, '#333');
  }

  // torso
  if (o.dress) body += P(`M-15 ${sh - 6} L15 ${sh - 6} L27 ${hip + 12} L-27 ${hip + 12} Z`, shirt, 'f');
  else {
    body += R(-18, sh - 6, 36, hip - sh + 10, shirt, 'f', 9);
    if (!sit) body += R(-18, hip - 8, 36, 12, legsC, '', 3);
  }

  // arms: [elbow, hand] per side
  const A = {
    stand: [[[-22, sh + 22], [-24, hip - 4]], [[22, sh + 22], [24, hip - 4]]],
    wave: [[[-22, sh + 22], [-24, hip - 4]], [[28, sh - 14], [30, sh - 38]]],
    up: [[[-28, sh - 14], [-30, sh - 38]], [[28, sh - 14], [30, sh - 38]]],
    hold: [[[-24, sh + 18], [-8, sh + 26]], [[24, sh + 18], [8, sh + 26]]],
    holdR: [[[-22, sh + 22], [-24, hip - 4]], [[30, sh + 14], [38, sh + 2]]],
    point: [[[-22, sh + 22], [-24, hip - 4]], [[30, sh - 2], [46, sh - 6]]],
    run: [[[-26, sh + 14], [-32, sh + 30]], [[26, sh + 14], [32, sh - 2]]]
  };
  let ap = A[o.arms || pose] || A.stand;
  if (pose === 'sit' && !o.arms) ap = A.hold;
  if (pose === 'kick' && !o.arms) ap = A.run;
  const [L, Rr] = ap;
  body += limb([[-15, sh], L[0], L[1]], shirt, 9) + limb([[15, sh], Rr[0], Rr[1]], shirt, 9);
  body += C(L[1][0], L[1][1], 5.5, skin) + C(Rr[1][0], Rr[1][1], 5.5, skin);

  // head
  head += R(-5, hy + 16, 10, 8, skin, '', 2);
  head += C(0, hy, 20, skin);
  if (o.sleep) head += P(`M-11 ${hy - 1} Q-7 ${hy + 3} -3 ${hy - 1}`) + P(`M3 ${hy - 1} Q7 ${hy + 3} 11 ${hy - 1}`);
  else head += C(-7, hy - 2, 2.4, K) + C(7, hy - 2, 2.4, K);
  if (o.mouth === 'open') head += E(0, hy + 9, 4, 5, '#a33');
  else if (o.mouth === 'sad') head += P(`M-7 ${hy + 12} Q0 ${hy + 5} 7 ${hy + 12}`);
  else head += P(`M-7 ${hy + 7} Q0 ${hy + 13} 7 ${hy + 7}`);
  // hair top
  const hs = o.hairStyle || (kind === 'girl' || kind === 'woman' ? 'long' : 'short');
  if (hs === 'curly') {
    for (let a = -170; a <= -10; a += 32) { const r = a * Math.PI / 180; head += C(Math.cos(r) * 19, hy + Math.sin(r) * 19, 8, hair); }
  } else if (hs !== 'bald') {
    head += P(`M-21 ${hy + 2} Q-22 ${hy - 25} 0 ${hy - 24} Q22 ${hy - 25} 21 ${hy + 2} Q17 ${hy - 12} 4 ${hy - 13} Q-10 ${hy - 16} -21 ${hy + 2} Z`, hair);
  } else {
    head += P(`M-20 ${hy + 2} Q-21 ${hy - 8} -15 ${hy - 10}`, 'none') + P(`M20 ${hy + 2} Q21 ${hy - 8} 15 ${hy - 10}`, 'none');
  }
  if (o.beard) head += P(`M-17 ${hy + 4} Q-14 ${hy + 28} 0 ${hy + 28} Q14 ${hy + 28} 17 ${hy + 4} Q8 ${hy + 16} 0 ${hy + 15} Q-8 ${hy + 16} -17 ${hy + 4} Z`, hair);
  if (o.glasses) head += `<g fill="none" class="o">${C(-8, hy - 2, 6.5, 'none')}${C(8, hy - 2, 6.5, 'none')}${Ln(-1.5, hy - 2, 1.5, hy - 2)}</g>`;
  if (o.hat) {
    const hc = o.hat.c || '#e74c3c';
    if (o.hat.style === 'sun') head += E(0, hy - 12, 34, 7, hc, 'f') + P(`M-17 ${hy - 13} Q-17 ${hy - 38} 0 ${hy - 38} Q17 ${hy - 38} 17 ${hy - 13} Z`, hc, 'f');
    else head += P(`M-21 ${hy - 6} Q-21 ${hy - 32} 0 ${hy - 32} Q21 ${hy - 32} 21 ${hy - 6} Z`, hc, 'f') + P(`M14 ${hy - 9} L36 ${hy - 6} L18 ${hy - 2} Z`, hc, 'f');
  }

  // held item
  if (o.item) {
    const it = o.item, is = it.s || 0.55;
    let hx, hy2;
    if ((o.arms || pose) === 'hold' || (sit && !o.arms)) { hx = 0; hy2 = sh + 36; }
    else { hx = Rr[1][0]; hy2 = Rr[1][1] + (it.dy || 12); }
    item = tr(OBJ[it.k](it.c), hx, hy2, is);
  }

  // hands in world coordinates (for strings / leads)
  const fl = o.flip ? -1 : 1;
  person.hands = { L: [x + fl * L[1][0] * s, y + L[1][1] * s], R: [x + fl * Rr[1][0] * s, y + Rr[1][1] * s] };

  let g = back + body + head + item;
  if (o.target) g = `<g data-target="${o.target}" class="tgt">${hit(-38, hy - 34, 80, -hy + 34 + (sit ? 46 : 2))}${g}</g>`;
  return tr(g, x, y, s, o.flip);
}

/* ---------------- OBJECTS ---------------- */
const OBJ = {
  ball: (c = '#e74c3c') => C(0, -20, 20, c, 'f') + P('M-20 -20 Q0 -8 20 -20') + P('M0 -40 Q-12 -20 0 0'),
  kite: (c = '#e74c3c') => P('M0 -60 L22 -30 L0 0 L-22 -30 Z', c, 'f') + Ln(0, -60, 0, 0, 1.5) + Ln(-22, -30, 22, -30, 1.5),
  book: (c = '#3b7dd8') => R(-24, -32, 48, 32, c, 'f', 3) + R(-16, -24, 32, 8, '#fff', '', 2),

/* =========================================================
   ENGINE - rendering, interaction, speech, scoring
   ========================================================= */
const COLOURS = {
  red: '#e74c3c', blue: '#3b7dd8', green: '#27ae60', yellow: '#f7d038', orange: '#f39c12',
  pink: '#f78fb3', purple: '#8e44ad', brown: '#8b5a2b', black: '#2b2b2b', grey: '#95a5a6'
};
const NUMS = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20 };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, cls = '', html = '') => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; };
const col = (id, inner, box) => `<g data-col="${id}" class="colable">${box ? hit(...box) : ''}${inner}</g>`;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function norm(s) {
  s = String(s).toLowerCase().replace(/[.,!?'"]/g, '').replace(/\s+/g, ' ').trim();
  s = s.replace(/^(a|an|the|some|her|his|their|my) /, '');
  if (NUMS[s] !== undefined) s = String(NUMS[s]);
  return s;
}
const matches = (val, answers) => answers.some(a => norm(val) === norm(a));

/* ---------------- SPEECH (browser voice) ---------------- */
const TTS = { voices: [], token: 0, keep: [] };
function loadVoices() { TTS.voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoices() {

/* ---------------- DRAG HELPER ---------------- */
function dragger(el, { onDrop, onClick, onMove, ghost = true }) {
  el.addEventListener('pointerdown', e => {
    if (el.classList.contains('locked')) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY; let moved = false, g = null;
    const move = ev => {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
        moved = true;
        if (ghost) { g = el.cloneNode(true); g.classList.add('ghost'); document.body.appendChild(g); }
      }
      if (moved) { if (g) { g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'; } onMove && onMove(ev); }
    };
    const up = ev => {
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      if (moved) { if (g) g.remove(); onDrop && onDrop(document.elementFromPoint(ev.clientX, ev.clientY), ev); }
      else onClick && onClick();
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
}

    gap.card = card; gap.textContent = card.dataset.w; gap.classList.add('filled'); card.classList.add('used');
  };
  cards.forEach(c => {
    if (c.classList.contains('excard')) return;
    dragger(c, {
      onDrop: el => { const g = el && el.closest && el.closest('.gap[data-ans]'); if (g && gapEls.includes(g)) place(c, g); },
      onClick: () => { sel = sel === c ? null : c; cards.forEach(x => x.classList.toggle('sel', x === sel)); }
    });
  });
  gapEls.forEach(g => g.onclick = () => {
    if (sel) { place(sel, g); sel.classList.remove('sel'); sel = null; return; }
    if (g.card) { unmark(wrap); g.card.classList.remove('used'); g.card = null; g.textContent = ''; g.classList.remove('filled'); }
  });
  wireFoot(shell, () => { let s = 0; gapEls.forEach(g => { const ok = g.card && g.card.dataset.w === g.dataset.ans; if (ok) s++; mark(g, !!ok); if (!ok) g.title = 'Answer: ' + g.dataset.ans; }); return { score: s, max: 5 }; },
    () => { gapEls.forEach(g => { if (g.card) g.card.classList.remove('used'); g.card = null; g.textContent = ''; g.classList.remove('filled'); g.title = ''; }); unmark(wrap); });
  return shell.sec;
}

/* =========================================================
   READING & WRITING PART 5 - one-word answers
   ========================================================= */
function R5(part, n) {
  const shell = partShell(n, 'Look at the pictures and read the questions. Write one-word answers.');
  const wrap = h('div', 'r5');
  const inputs = [];
  part.pics.forEach((p, pi) => {
    const blk = h('div', 'r5blk');
    blk.appendChild(h('div', 'r5pic', p()));
    const qs = h('div', 'qlist');
    const exs = part.examples.filter(e => e.pic === pi);
    if (exs.length) { qs.appendChild(h('div', 'sub', 'Examples')); exs.forEach(e => qs.appendChild(h('div', 'qrow', `<span class="qt">${e.q}</span><span class="ans">${e.pre || ''}<span class="filled">${e.a}</span>${e.post || ''}</span>`))); }
    const its = part.items.map((it, i) => ({ it, i })).filter(o => o.it.pic === pi);
    if (its.length) {
      if (exs.length) qs.appendChild(h('div', 'sub', 'Questions'));
      its.forEach(({ it, i }) => { const row = h('div', 'qrow', `<span class="qn">${i + 1}</span><span class="qt">${it.q}</span><span class="ans">${it.pre || ''}<input type="text" autocomplete="off" spellcheck="false">${it.post || ''}</span>`); qs.appendChild(row); inputs[i] = $('input', row); });
    }
    blk.appendChild(qs); wrap.appendChild(blk);
  });
  shell.body.appendChild(wrap);
  wireFoot(shell, () => { let s = 0; inputs.forEach((inp, i) => { const ok = matches(inp.value, part.items[i].ans); if (ok) s++; mark(inp, ok); inp.title = ok ? '' : 'Answer: ' + part.items[i].ans[0]; }); return { score: s, max: 5 }; },
    () => { inputs.forEach(i => { i.value = ''; i.title = ''; }); unmark(wrap); });
  return shell.sec;
}

function updateTotals() {

}
function show() {
  stopAudio();

  $$('.section').forEach(s => s.style.display = (s.dataset.s === current.s) ? '' : 'none');
  $$('.ttab').forEach((b, i) => b.classList.toggle('on', i === current.t));
  $$('.stab').forEach(b => b.classList.toggle('on', b.dataset.s === current.s));
  updateTotals();
  requestAnimationFrame(() => REDRAW.forEach(f => f()));
}
function init() {
  const tabs = $('#ttabs');

}
